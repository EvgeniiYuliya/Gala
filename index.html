<!DOCTYPE html>
<html lang="ru">
<head>
<a class="logo-container" href="/">
    <img alt="ITK Logo" class="logo-image" src="logo.svg" style="height: 40px; width: auto;">
</a>
        <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Source+Sans+Pro:wght@300;400;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --hex-black: #0a0a0a;
            --hex-border: #3a3a3a;
            --hex-border-light: #4a4a4a;
            --itk-green: #1A5C3A;
            --itk-gold: #C9A961;
            --itk-gold-light: #D4B876;
        }

        body {
            font-family: 'Source Sans Pro', sans-serif;
            background: #000;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* ===== ВИДЕО ФОН ===== */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .video-background video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            filter: brightness(0.6) contrast(1.1);
        }

        /* ===== HEADER ===== */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 25px 60px;
            display: flex;
            align-items: center;
            gap: 25px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.6);
            border-bottom: 1px solid rgba(201, 169, 97, 0.15);
        }

        .gold-square {
            width: 55px;
            height: 55px;
            background: var(--itk-gold);
            box-shadow: 0 2px 15px rgba(201, 169, 97, 0.4);
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }
.logo-image {
    height: 40px; /* Можете поменять размер здесь */
    width: auto;
    object-fit: contain;
}
        .logo-itk {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 900;
            color: var(--itk-green);
            letter-spacing: 2px;
        }

        .logo-full {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 1.5px;
            margin-top: 2px;
            font-weight: 300;
            text-transform: uppercase;
        }

        /* ===== MAIN CONTAINER ===== */
        .main-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .hex-grid {
            position: relative;
            width: 1100px;
            height: 650px;
            transform-origin: center center;
        }

        .hexagon {
            position: absolute;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            clip-path: polygon(16.67% 0%, 83.33% 0%, 100% 50%, 83.33% 100%, 16.67% 100%, 0% 50%);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transform: scale(0);
            transition: filter 0.4s, box-shadow 0.4s;
        }

        .hexagon::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            background: linear-gradient(135deg, var(--hex-border-light), var(--hex-border));
            clip-path: polygon(16.67% 0%, 83.33% 0%, 100% 50%, 83.33% 100%, 16.67% 100%, 0% 50%);
            z-index: -1;
        }

        .hexagon.large {
            width: 200px;
            height: 115px;
        }

        .hexagon.small {
            width: 80px;
            height: 46px;
        }

        .hexagon:hover {
            filter: brightness(1.4);
            box-shadow: 0 0 40px rgba(201, 169, 97, 0.5);
        }

        .hexagon.flying {
            animation: flyIn 2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        .hexagon.flying-category {
            animation: flyInCategory 3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes flyIn {
            0% {
                opacity: 0;
                transform: scale(0.1) translate(var(--start-x), var(--start-y));
                filter: blur(10px);
            }
            50% {
                opacity: 1;
                filter: blur(2px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translate(0, 0);
                filter: blur(0);
            }
        }

        @keyframes flyInCategory {
            0% {
                opacity: 0;
                transform: scale(0.1) translate(var(--start-x), var(--start-y));
                filter: blur(10px);
            }
            40% {
                opacity: 1;
                transform: scale(3) translate(0, 0);
                filter: blur(0);
            }
            60% {
                transform: scale(3) translate(0, 0);
                filter: blur(0);
            }
            80% {
                transform: scale(1.5) translate(0, 0);
                filter: blur(0);
            }
            100% {
                opacity: 1;
                transform: scale(1) translate(0, 0);
                filter: blur(0);
            }
        }

        .hex-image {
            position: absolute;
            width: 55%;
            height: 60%;
            object-fit: contain;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 20;
        }

        .hexagon.show-image .hex-image {
            opacity: 1;
            transform: scale(1);
        }

        .hex-title {
            position: absolute;
            bottom: 10%;
            font-family: 'Playfair Display', serif;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--itk-gold);
            text-align: center;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.6s 0.3s;
            z-index: 20;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
            letter-spacing: 0.5px;
            width: 85%;
        }

        .hexagon.show-image .hex-title {
            opacity: 1;
            transform: translateY(0);
        }

        /* ===== BOTTOM BAR ===== */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 35px;
            background: rgba(26, 92, 58, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 60px;
            z-index: 100;
            border-top: 1px solid rgba(201, 169, 97, 0.3);
        }

        .bottom-text {
            color: rgba(255,255,255,0.85);
            font-size: 0.75rem;
            letter-spacing: 2px;
            font-weight: 300;
        }

        .bottom-text span {
            color: var(--itk-gold);
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .header { padding: 15px 25px; }
            .gold-square { width: 40px; height: 40px; }
            .logo-itk { font-size: 1.4rem; }
            .logo-full { font-size: 0.65rem; }
            .hex-title { font-size: 0.6rem; }
        }
    </style>
</head>
<body>
    <!-- Видео фон галактики -->
    <div class="video-background">
        <video 
            id="galaxyVideo"
            autoplay 
            muted 
            loop 
            playsinline>
            <source src="videos/Gala7.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="gold-square"></div>
        <div class="logo-text">
            <div class="logo-itk">ITK</div>
            <div class="logo-full">International Technology Key</div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        <div class="hex-grid" id="hexGrid">
            <div class="hexagon large" data-index="0" data-category="implants"></div>
            <div class="hexagon large" data-index="1"></div>
            <div class="hexagon large" data-index="2" data-category="cardio"></div>
            <div class="hexagon large" data-index="3"></div>
            
            <div class="hexagon small" data-index="4"></div>
            
            <div class="hexagon large" data-index="5" data-category="tomography"></div>
            <div class="hexagon large" data-index="6"></div>
            
            <div class="hexagon small" data-index="7"></div>
            
            <div class="hexagon large" data-index="8" data-category="diagnostics"></div>
            <div class="hexagon large" data-index="9"></div>
            <div class="hexagon large" data-index="10" data-category="rehabilitation"></div>
            <div class="hexagon large" data-index="11" data-category="preparations"></div>
        </div>
    </div>

    <!-- Bottom Bar -->
    <div class="bottom-bar">
        <div class="bottom-text">itk.<span>company</span></div>
    </div>

    <script>
        const categories = {
            implants: { 
                title: 'Костные импланты', 
                image: '/EvgeniiYuliya/Gala/blob/main/image/Head1.jpg'
            },
            cardio: { 
                title: 'Сердечно-сосудистая система', 
                image: 'images/Head1.jpg'
            },
            tomography: { 
                title: 'Томографы и рентгены', 
                image: 'images/tomography.jpg'
            },
            diagnostics: { 
                title: 'Диагностическое оборудование', 
                image: 'images/diagnostics.jpg'
            },
            rehabilitation: { 
                title: 'Оборудование для реабилитации', 
                image: 'images/rehabilitation.jpg'
            },
            preparations: { 
                title: 'Высококачественные препараты', 
                image: 'images/preparations.jpg'
            }
        };

        const finalPositions = [
            { x: 170, y: 100 },
            { x: 380, y: 100 },
            { x: 590, y: 100 },
            { x: 800, y: 100 },
            { x: 402, y: 228 },
            { x: 380, y: 285 },
            { x: 590, y: 285 },
            { x: 690, y: 410 },
            { x: 170, y: 465 },
            { x: 380, y: 465 },
            { x: 590, y: 465 },
            { x: 800, y: 465 }
        ];

        const hexagons = document.querySelectorAll('.hexagon');
        const hexGrid = document.getElementById('hexGrid');

        function setPositions() {
            hexagons.forEach((hex, index) => {
                if (finalPositions[index]) {
                    hex.style.left = finalPositions[index].x + 'px';
                    hex.style.top = finalPositions[index].y + 'px';
                }
            });
        }

        function scaleGrid() {
            const gridWidth = 1100;
            const gridHeight = 650;
            const padding = 100;
            
            const availableWidth = window.innerWidth - padding;
            const availableHeight = window.innerHeight - padding - 100;
            
            const scaleX = availableWidth / gridWidth;
            const scaleY = availableHeight / gridHeight;
            
            const scale = Math.min(scaleX, scaleY, 1);
            
            hexGrid.style.transform = `scale(${scale})`;
        }

        function animateHexagon(index, delay) {
            setTimeout(() => {
                const hexagon = hexagons[index];
                const isCategory = hexagon.hasAttribute('data-category');
                
                hexagon.style.setProperty('--start-x', '-1000px');
                hexagon.style.setProperty('--start-y', '-1000px');
                
                if (isCategory) {
                    hexagon.classList.add('flying-category');
                } else {
                    hexagon.classList.add('flying');
                }

                if (isCategory) {
                    const category = categories[hexagon.getAttribute('data-category')];
                    
                    const img = document.createElement('img');
                    img.src = category.image;
                    img.alt = category.title;
                    img.className = 'hex-image';
                    img.onerror = function() {
                        this.style.display = 'none';
                    };
                    hexagon.appendChild(img);

                    const title = document.createElement('div');
                    title.className = 'hex-title';
                    title.textContent = category.title;
                    hexagon.appendChild(title);

                    setTimeout(() => {
                        hexagon.classList.add('show-image');
                    }, 1200);
                }

                setTimeout(() => {
                    hexagon.classList.remove('flying', 'flying-category');
                    hexagon.style.opacity = '1';
                    hexagon.style.transform = 'scale(1)';
                }, isCategory ? 3000 : 2000);

            }, delay);
        }

        // Запуск видео
        const video = document.getElementById('galaxyVideo');
        video.play().catch(error => {
            console.log('Автовоспроизведение:', error);
        });

        setPositions();
        scaleGrid();
        window.addEventListener('resize', scaleGrid);

        const animationSequence = [
            { index: 0, delay: 500 },
            { index: 1, delay: 2500 },
            { index: 2, delay: 3500 },
            { index: 3, delay: 6500 },
            { index: 4, delay: 8500 },
            { index: 5, delay: 9500 },
            { index: 6, delay: 12500 },
            { index: 7, delay: 14500 },
            { index: 8, delay: 16500 },
            { index: 9, delay: 19500 },
            { index: 10, delay: 20500 },
            { index: 11, delay: 22500 }
        ];

        animationSequence.forEach(seq => {
            animateHexagon(seq.index, seq.delay);
        });

        setTimeout(() => {
            hexagons.forEach(hex => {
                hex.addEventListener('mouseenter', () => {
                    hex.style.filter = 'brightness(1.4)';
                });
                hex.addEventListener('mouseleave', () => {
                    hex.style.filter = 'brightness(1)';
                });
            });
        }, 25000);
    </script>
</body>
</html>
